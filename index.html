<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACK RUSSIA · Бонус 100BC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <div class="bonus-icon">
            <img src="https://svgicons.com/img/227038/black-russia.svg" alt="Black Russia" width="80" height="80">
        </div>

        <h1>BLACK RUSSIA</h1>
        <div class="subhead">Бонусный счёт</div>

        <div class="bonus-amount">
            <span class="number">100</span>
            <span class="currency">BC</span>
        </div>

        <button class="claim-btn" id="openModalBtn">Забрать 100 BC</button>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-form">
            <div class="modal-header">
                <h2>Начисление 100BC</h2>
                <button class="modal-close" id="closeModalBtn" aria-label="Закрыть">×</button>
            </div>
            <div class="modal-sub">Введите данные для начисления</div>

            <form id="claimForm">
                <div class="input-group">
                    <label for="nickname">Никнейм</label>
                    <input type="text" id="nickname" placeholder="TestHero" autocomplete="off" required>
                </div>
                <div class="input-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="off" required>
                </div>
                <div class="input-group">
                    <label for="server">Сервер</label>
                    <input type="text" id="server" placeholder="Test-01" autocomplete="off" required>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">Начислить 100BC</button>
            </form>
        </div>
    </div>

    <div class="toast-message" id="toastMessage">✅ 100BC зачислено</div>

    <script src="script.js"></script>
</body>
</html>
